site_name: Manuel de l'Employé — Stovax Gazco
site_description: Manuel de l'employé du Groupe Stovax (Stovax Limited et Gazco Limited)
site_url: https://stovaxgazco.github.io/employee-handbook/fr/

theme:
  name: material
  language: fr
  logo: img/logo.png
  palette:
    - scheme: default
      primary: custom
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Mode sombre
    - scheme: slate
      primary: custom
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Mode clair
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.expand
    - toc.follow
    - search.suggest
    - search.highlight
  font:
    text: Roboto
    code: Roboto Mono

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

