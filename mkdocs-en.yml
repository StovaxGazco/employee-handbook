site_name: Employee Handbook — Stovax Gazco
site_description: Employee Handbook for Stovax Group (Stovax Limited and Gazco Limited)
site_url: https://stovaxgazco.github.io/employee-handbook/en/

docs_dir: docs-en

theme:
  name: material
  language: en
  logo: img/logo.png
  palette:
    - scheme: default
      primary: custom
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: custom
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.expand
    - toc.follow
    - search.suggest
    - search.highlight
  font:
    text: Roboto
    code: Roboto Mono

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

